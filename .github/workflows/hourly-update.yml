name: Match 91 Tracker Update

on:
  workflow_dispatch:
    inputs:
      run_update:
        description: "Set to true to run a manual tracker update."
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: match-91-tracker-update
  cancel-in-progress: false

jobs:
  update:
    if: ${{ inputs.run_update == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Regenerate tracker
        run: python scripts/update_tracker.py

      - name: Commit tracker update
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Hourly Match 91 tracker update"
          file_pattern: "data/tracker.json docs/index.html docs/.nojekyll docs/reports/*.md reports/*.md"
